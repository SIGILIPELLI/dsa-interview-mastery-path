site_name: DSA & Coding Interviews Mastery Path
site_description: A structured, module-wise data structures, algorithms and coding-interview program — patterns, tested Python solutions, and interview strategy.
site_url: https://sigilipelli.github.io/dsa-interview-mastery-path/
repo_url: https://github.com/sigilipelli/dsa-interview-mastery-path
repo_name: dsa-interview-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Big-O & Complexity Analysis": level-1/01-big-o-complexity.md
      - "02 · Arrays & Strings": level-1/02-arrays-strings.md
      - "03 · Hash Maps & Sets": level-1/03-hash-maps-sets.md
      - "04 · Two Pointers": level-1/04-two-pointers.md
      - "05 · Sliding Window": level-1/05-sliding-window.md
      - "06 · Stacks & Queues": level-1/06-stacks-queues.md
      - "07 · Linked Lists": level-1/07-linked-lists.md
      - "08 · Recursion Fundamentals": level-1/08-recursion.md
      - "09 · Sorting & Binary Search": level-1/09-sorting-binary-search.md
      - "10 · Project — Timed Practice Set 1": level-1/10-project-timed-practice-set.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Binary Trees & Traversals": level-2/01-trees-traversals.md
